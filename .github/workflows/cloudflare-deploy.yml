name: Cloudflare deploy

# Reusable deployment workflow for repositories that need to deploy to Cloudflare.
# The calling repository must provide a secret named CLOUDFLARE_API_TOKEN.
# This workflow does not define or store the secret itself; it only consumes it.

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
        description: Cloudflare API token used by the deployment job.

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy via Vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:vinext
