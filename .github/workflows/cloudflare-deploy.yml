name: Cloudflare deploy

# Reusable deployment workflow for repositories that need to deploy to Cloudflare.
# The calling repository must provide the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# This workflow does not define or store those secrets itself; it only consumes them.

'on':
  workflow_call:
    inputs:
      worker_name:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
        description: Cloudflare API token used by the deployment job.
      CLOUDFLARE_ACCOUNT_ID:
        required: true
        description: Cloudflare account ID used by the deployment job.

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy via Vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ inputs.worker_name }}
        run: npm run deploy:vinext
